[package]
name = "autowasm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tree-sitter = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
wasmtime = "48.0.1"
wat = "1.258.0"

[dev-dependencies]
tempfile = "3.27.0"
